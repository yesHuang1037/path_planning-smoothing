/**:
  ros__parameters:
    # ===================== [A] 基础地图/地形 =====================
    # 是否启用楼梯高度约束（平面导航一般 false）
    enable_downstairs: false
    # 全局规划节点的避障职责模式：
    # global_replan  : 全局规划承担动态障碍检查、路径截断和触发重规划。
    # global_monitor : 接收/监控动态障碍，但不因动态障碍主动重规划。
    # global_only    : 纯全局规划，只在新目标等全局规划事件时规划，避障交给局部控制器。
    avoidance_mode: global_monitor
    path_simplification_mode: legacy
    path_simplification_tolerance_m: 0.1

    # ===================== [B] A* 搜索代价 =====================
    # A* 对障碍距离的代价权重（越大越倾向远离障碍）
    obstacle_cost_weight: 10.0
    # A* 对动态障碍的额外惩罚权重
    dynamic_penalty_weight: 0.0

    # ===================== [C] 动态障碍来源与建图 =====================
    # 是否使用点云动态障碍源（/cloud_livox_obs）
    use_pointcloud_dynamic_obstacles: false
    # 是否使用 costmap 动态障碍源
    use_costmap_dynamic_obstacles: true
    # 融合通行判据时是否使用 costmap clearance（与 ESDF 取最小）。
    # 低敏配置关闭：costmap 仍作为动态障碍写入 ESDF，但不额外叠一层 clearance 搜索。
    use_costmap_clearance_fusion: false

    # 点云障碍“障碍侧膨胀半径”（m）：
    # 把单个点云障碍点向周围扩成圆形占据区，补偿点稀疏/噪声/时延。
    obstacle_expand_radius: 0.10
    # 旧参数兼容名：若 > 0，会覆盖 obstacle_expand_radius。
    voronoi_radius: -1.0

    # costmap 栅格占据阈值（0~100），>= 该值判为障碍
    costmap_occupied_threshold: 65
    # costmap 全量地图话题
    costmap_topic: /costmap/costmap
    # costmap 增量更新话题
    costmap_update_topic: /costmap/costmap_updates

    # ===================== [D] 通行判据（前视采样） =====================
    # 机器人内接半径（m）
    robot_inscribed_radius: 0.01
    # 通行判据“判据侧余量”（m）：
    # required_clearance = robot_inscribed_radius + clearance_margin。
    # 这不是改地图本身，而是提高“可通行阈值”，效果等价于更保守的判据膨胀。
    clearance_margin: 0.0
    # 前视采样检查距离（m）
    forward_check_distance: 1.0
    # 前视采样步长（m）
    forward_sample_step: 0.10
    # 是否启用前方路径通行性检查；global_only 模式会强制关闭。
    enable_forward_path_check: true
    # 是否启用整条路径碰撞检查；global_only 模式会强制关闭。
    # 低敏配置关闭：只检查机器人前方一小段，避免远处动态障碍过早打断当前路径。
    enable_path_collision_check: false
    # 起点占据时的“脱困模式”：
    # 仅在起点落在占据栅格时触发，前 N 步可放宽碰撞/净空约束以脱困。
    # 一旦脱离占据/净空不足区域，立即恢复正常避障判据。
    enable_start_escape_mode: true
    start_escape_steps: 20
    # 终点占据/净空不足时的“终点逃生”：
    # 在目标点周围半径内搜索替代终点，避免因定位误差或局部噪声导致 NO_PATH。
    enable_goal_escape_mode: true
    # 替代终点搜索半径（m）
    goal_escape_search_radius: 1.5
    # 终点净空容忍（m）：
    # relaxed_clearance = required_clearance - goal_escape_clearance_tolerance
    goal_escape_clearance_tolerance: 0.08

    # ===================== [E] 碰撞/阻塞处理 =====================
    # 直接碰撞检查半径（m）。
    # 实际使用阈值为 max(check_collision_radius, required_clearance)。
    check_collision_radius: 0.10
    # 检测到阻塞后是否先截断当前路径，再触发重规划
    enable_blocked_path_truncation: false
    # 路径截断点相对阻塞区的额外安全余量（m）
    blocked_path_truncation_margin: 0.20
    # 是否启用“截断点局部 block 区”：把触发截断的附近区域临时加入动态禁行
    enable_blocked_zone_memory: false
    # block 区半径（m，可调）：
    # 半径越大，越不容易重复搜回同一条贴障路径；但也更保守。
    blocked_zone_memory_radius: 0.15
    # block 区保留时间（s，可调）：
    # 超过该时间会自动清理，这样后续允许重新搜索经过该区域的路径。
    blocked_zone_memory_ttl_sec: 2.0

    # ===================== [F] 重规划触发节流/停滞判据 =====================
    # 运行时检查周期（s）：越小越实时，但 CPU 占用更高
    monitor_period_sec: 0.50
    # 两次重规划的最小间隔（s）
    min_replan_interval_sec: 1.5
    # 是否启用“停滞触发重规划”
    enable_stall_trigger: true
    # 停滞时间窗（s）
    stall_window_sec: 12.0
    # 时间窗内位移小于该值（m）判定为“几乎没动”
    stall_move_threshold: 0.03
    # 距离目标小于该值（m）时，不触发停滞重规划
    stall_goal_distance_threshold: 0.30
    # 按原因控制重规划触发；例如只禁用 costmap 阻塞触发时，把 costmap_blocked 设为 false。
    # global_only 模式会强制关闭动态避障相关触发。
    replan_triggers:
      new_goal: true
      manual: true
      map_update: false
      # 低敏配置：动态障碍更新只刷新障碍层，不直接抢占触发重规划。
      # 真正需要改路时，由定时器前视检查或周期重规划统一处理。
      costmap_blocked: true
      pointcloud_blocked: false
      path_collision: true
      stall: true
      periodic: true
